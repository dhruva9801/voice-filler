<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #fbf8ec; --fg: #141414; --muted: #6b6450;
      --accent: #b8860b; --accent-fg: #000;
      --surface: #efe8cf; --border: #d6c48a;
    }
    :root[data-theme="dark"] {
      --bg: #0b0b0b; --fg: #ece4c4; --muted: #9a8f6a;
      --accent: #c9a227; --accent-fg: #0b0b0b;
      --surface: #171612; --border: #3b3420;
    }
    body { margin: 0; padding: 10px; background: var(--bg); color: var(--fg);
           font: 13px/1.4 system-ui, sans-serif; }
    button { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 4px;
             padding: 5px 9px; margin: 0 4px 4px 0; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--border); }
    h4 { margin: 12px 0 4px; color: var(--accent); text-transform: uppercase;
         font-size: 11px; letter-spacing: .06em; }
    .current { color: var(--accent); font-weight: 700; }
    .opts { color: var(--muted); font-weight: 400; padding-left: 16px; }
    input { background: var(--surface); color: var(--fg); border: 1px solid var(--border);
            border-radius: 4px; padding: 5px; width: 38%; }
    pre { background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
          padding: 6px; white-space: pre-wrap; max-height: 220px; overflow: auto; }
    #profileList div { margin: 2px 0; }
    #profileList button { padding: 1px 6px; }
  </style>
</head>
<body>
  <button id="scan">Scan page</button>
  <button id="mic">Start mic</button>
  <button id="autofill">Autofill saved</button>
  <button id="media">Find audio/video</button>
  <button id="theme" class="ghost">Dark</button>
  <button id="close" class="ghost">Close</button>

  <h4>Fields</h4>
  <div id="fields"></div>
  <div id="mediaList"></div>

  <h4>Saved info</h4>
  <div id="profileList"></div>
  <input id="pKey" placeholder="name (e.g. email)">
  <input id="pVal" placeholder="value">
  <button id="pSave">Save</button>

  <h4>Log</h4>
  <pre id="log"></pre>

  <script src="panel.js"></script>
</body>
</html>
